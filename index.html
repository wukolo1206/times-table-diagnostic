<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>九九乘法診斷</title>
<link rel="stylesheet" href="style.css?v=202608312049">
<style>
  .row-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; max-width: 460px; }
  .row-btn {
    background: #fff; border: 1px solid var(--line); color: var(--muted);
    padding: 16px 0; font-size: 20px; font-weight: 700;
  }
  .row-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  button.small { font-size: 15px; padding: 8px 14px; }
  .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .mode-btn {
    display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
    text-align: left; padding: 16px; background: #fff; color: var(--ink);
    border: 1px solid var(--line);
  }
  .mode-btn:disabled { background: #fbfaf8; }
  .mode-btn .mt { font-size: 19px; font-weight: 700; color: var(--accent); }
  .mode-btn:disabled .mt { color: var(--muted); }
  .mode-btn .ms { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>九九乘法診斷</h1>
  <p class="sub">先選出你自己，再開始作答。</p>

  <div class="card" id="codeCard">
    <label for="code">班級代碼</label>
    <input type="text" id="code" autocomplete="off" autocapitalize="characters" placeholder="例如 A7K2Q9">
    <div style="margin-top:12px"><button id="go">下一步</button></div>
    <div class="msg" id="codeMsg"></div>
  </div>

  <div class="card" id="seatCard" hidden>
    <div id="className" style="font-size:18px;font-weight:700"></div>
    <p class="sub" style="margin:6px 0 0">找到自己的座號，點一下。</p>
    <div class="seat-grid" id="seats"></div>
    <div class="msg" id="seatMsg"></div>
  </div>

  <div class="card" id="rangeCard" hidden>
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">要測哪幾的乘法？</div>
    <p class="sub" style="margin:0 0 10px">點選要測的數字，可以複選。</p>
    <div class="row-grid" id="rows"></div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost small" data-preset="all">全選</button>
      <button class="ghost small" data-preset="hard">6～9</button>
      <button class="ghost small" data-preset="none">清除</button>
    </div>
    <div style="margin-top:14px;font-size:17px" id="count">共 81 題</div>

    <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:16px">
      <div style="font-size:17px;font-weight:700;margin-bottom:8px">要做什麼？</div>
      <p class="sub" id="modeHint" style="margin:0 0 8px">先在上面點選要測的數字。</p>
      <div class="mode-grid">
        <button class="mode-btn" id="modeDiag">
          <span class="mt">診斷</span>
          <span class="ms">全部做完，找出哪些還不熟</span>
        </button>
        <button class="mode-btn" id="modeSprint">
          <span class="mt">精熟練習</span>
          <span class="ms">限時搶答，專練自己的弱項</span>
        </button>
      </div>
      <div style="margin-top:14px">
        <button id="mine" class="ghost" disabled>看我的紀錄</button>
      </div>
    </div>
  </div>

  <div style="text-align:center;margin-top:24px">
    <button id="toTeacher" class="ghost small" style="color:var(--muted);border-color:var(--line)">
      老師管理
    </button>
  </div>
</div>

<script src="fact-core.js?v=202608312049"></script>
<script src="fact-net.js?v=202608312049"></script>
<script src="config.js?v=202608312049"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var picked = null;

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function api(action, params) {
    var url = window.TTD_GAS_URL + '?action=' + action;
    Object.keys(params || {}).forEach(function (k) {
      url += '&' + k + '=' + encodeURIComponent(params[k]);
    });
    return fetch(url, { redirect: 'follow' }).then(function (r) { return r.json(); });
  }

  function loadClass(code) {
    $('codeMsg').textContent = '查詢中…';
    $('codeMsg').className = 'msg';
    api('students', { cls: code }).then(function (r) {
      if (!r.ok) {
        $('codeMsg').textContent = '找不到這個班級代碼，請再確認一次。';
        $('codeMsg').className = 'msg err';
        return;
      }
      $('codeMsg').textContent = '';
      $('className').textContent = r.className;
      $('codeCard').hidden = true;
      $('seatCard').hidden = false;
      sessionStorage.setItem('ttd_class', code);

      var box = $('seats');
      box.innerHTML = '';
      r.students.forEach(function (s) {
        var b = document.createElement('button');
        b.className = 'seat-btn';
        b.textContent = s.name ? (s.seat + ' ' + s.name) : String(s.seat);
        b.onclick = function () {
          Array.prototype.forEach.call(box.children, function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          picked = s;
          $('rangeCard').hidden = false;
          $('mine').disabled = false;
          updateCount();
        };
        box.appendChild(b);
      });
    }).catch(function () {
      $('codeMsg').textContent = '連不上伺服器，請確認網路。';
      $('codeMsg').className = 'msg err';
    });
  }

  $('go').onclick = function () {
    var code = $('code').value.trim().toUpperCase();
    if (!code) { $('codeMsg').textContent = '請先輸入班級代碼。'; return; }
    loadClass(code);
  };
  $('code').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('go').click();
  });

  /* ---- 測驗範圍 ---- */
  var C = window.FactCore;
  var selected = {};

  function buildRows() {
    var box = $('rows');
    box.innerHTML = '';
    for (var a = 1; a <= 9; a++) {
      (function (a) {
        selected[a] = false;          // 預設全不選：點到的才測，而不是點掉不想測的
        var b = document.createElement('button');
        b.className = 'row-btn';
        b.textContent = a;
        b.onclick = function () {
          selected[a] = !selected[a];
          b.classList.toggle('on', selected[a]);
          updateCount();
        };
        box.appendChild(b);
      })(a);
    }
  }
  buildRows();

  function chosenRows() {
    var out = [];
    for (var a = 1; a <= 9; a++) if (selected[a]) out.push(a);
    return out;
  }

  function updateCount() {
    var n = chosenRows().length * 9;
    $('count').textContent = n === 0 ? '請點選要測的數字' : ('共 ' + n + ' 題');
    var off = (n === 0 || !picked);
    $('modeDiag').disabled = off;
    $('modeSprint').disabled = off;
    $('modeHint').hidden = !off;
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (btn) {
    btn.onclick = function () {
      var p = btn.getAttribute('data-preset');
      for (var a = 1; a <= 9; a++) {
        selected[a] = (p === 'all') ? true : (p === 'hard') ? (a >= 6) : false;
      }
      Array.prototype.forEach.call($('rows').children, function (b, i) {
        b.classList.toggle('on', selected[i + 1]);
      });
      updateCount();
    };
  });

  function goTo(page, withRange) {
    var code = sessionStorage.getItem('ttd_class');
    sessionStorage.setItem('ttd_seat', picked.seat);
    sessionStorage.setItem('ttd_name', picked.name || '');
    // 查詢參數，不用 hash（GAS 慣例）
    var url = page + '?cls=' + encodeURIComponent(code) + '&seat=' + picked.seat;
    if (withRange) url += '&r=' + C.formatRows(chosenRows());
    location.href = url;
  }

  $('modeDiag').onclick = function () { goTo('diagnose.html', true); };
  $('modeSprint').onclick = function () { goTo('sprint.html', true); };
  $('mine').onclick = function () { goTo('me.html', false); };

  // 老師入口：學生不會誤按（要 PIN 才進得去），老師也不用記第二個網址
  $('toTeacher').onclick = function () {
    var code = sessionStorage.getItem('ttd_class') || qs('cls') || $('code').value.trim().toUpperCase();
    location.href = 'teacher.html' + (code ? ('?cls=' + encodeURIComponent(code)) : '');
  };

  // 網址帶了班級代碼就直接進第二步
  var pre = qs('cls');
  if (pre) { $('code').value = pre; loadClass(pre); }
})();
</script>
</body>
</html>
