<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>九九乘法診斷｜作答</title>
<link rel="stylesheet" href="style.css?v=202608301315">
<style>
  .stage { text-align: center; }
  .progress { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
  .q { font-size: 60px; font-weight: 700; letter-spacing: 4px; margin: 20px 0 8px; }
  .ansbox {
    font-size: 42px; height: 62px; letter-spacing: 6px;
    border-bottom: 3px solid var(--line); display: inline-block; min-width: 140px;
  }
  .fb { height: 34px; font-size: 26px; margin-top: 6px; }
  .fb.ok { color: var(--fluent); }
  .fb.no { color: var(--weak); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .pad button {
    font-size: 30px; padding: 16px 0; background: #fff; color: var(--ink);
    border: 1px solid var(--line);
  }
  .pad button.wide { font-size: 20px; }
  .pad button:active { background: var(--line); }
  /* 沒輸入時送出鍵是暗的，輸入一個數字後亮起來——
     兩位數會自動送出，只有一位數需要按，所以要讓學生一眼看到該按哪 */
  .pad button:disabled { background: #fbfaf8; color: #cdc8be; border-color: var(--line); }
  .pad button.go {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-weight: 700; box-shadow: 0 0 0 3px rgba(63, 125, 140, .18);
  }
  .dot {
    width: 170px; height: 170px; border-radius: 50%; margin: 20px auto;
    background: var(--unknown); display: flex; align-items: center;
    justify-content: center; font-size: 22px; color: var(--muted); cursor: pointer;
    user-select: none;
  }
  .dot.go { background: var(--fluent); color: #fff; }
  .intro { text-align: left; line-height: 1.9; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card stage" id="introStage">
    <h1>準備開始</h1>
    <p class="sub" id="who"></p>
    <p class="intro">
      這裡有 <strong id="introTotal">81</strong> 題乘法（<span id="introRows"></span>）。<br>
      <strong>看到題目就直接寫出答案</strong>，不用算，想不出來就跳過。<br>
      我們想知道你哪幾題還不熟，答錯沒有關係。
    </p>
    <button id="toBaseline">開始</button>
  </div>

  <div class="card stage" id="baselineStage" hidden>
    <h1>先測手速</h1>
    <p class="sub">圓圈變成綠色，就馬上按它。共 5 次。</p>
    <div class="dot" id="dot">等一下…</div>
    <div class="msg" id="baseMsg"></div>
  </div>

  <div class="card stage" id="quizStage" hidden>
    <div class="progress" id="prog">1 / 81</div>
    <div class="q" id="q">7 × 8</div>
    <div class="ansbox" id="ans">&nbsp;</div>
    <div class="fb" id="fb"></div>
    <div class="pad" id="pad"></div>
    <div style="margin-top:14px">
      <button id="stopEarly" class="ghost" style="font-size:15px;padding:8px 14px">先做到這裡</button>
    </div>
  </div>

  <div class="card stage" id="breakStage" hidden>
    <h1>休息一下</h1>
    <p class="sub">已經完成一半了。準備好再繼續。</p>
    <button id="resume">繼續作答</button>
  </div>

  <div class="card stage" id="doneStage" hidden>
    <h1>完成了</h1>
    <p class="sub" id="doneSummary"></p>
    <div class="msg" id="upMsg">成績上傳中…</div>
    <div style="margin-top:16px">
      <button id="toMe">看我的結果</button>
    </div>
  </div>

</div>

<script src="fact-core.js?v=202608301315"></script>
<script src="fact-net.js?v=202608301315"></script>
<script src="fact-quiz.js?v=202608301315"></script>
<script src="config.js?v=202608301315"></script>
<script>
(function () {
  'use strict';
  var C = window.FactCore, N = window.FactNet, Q = window.FactQuiz;
  var $ = function (id) { return document.getElementById(id); };

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  var classCode = qs('cls');
  var seat = Number(qs('seat'));
  var isProxy = qs('proxy') === '1';
  var rows = C.parseRows(qs('r'));          // 沒帶就是全部 81 題（相容舊網址）
  var TOTAL = rows.length * 9;
  // 題數少的時候不插中場休息，反而打斷節奏
  var BREAK_AT = TOTAL >= 40 ? Math.floor(TOTAL / 2) : -1;
  var name = sessionStorage.getItem('ttd_name') || '';
  if (!classCode || !seat) { location.href = 'index.html'; return; }
  $('who').textContent = (name ? (name + '（' + seat + ' 號）') : (seat + ' 號')) +
                         (isProxy ? '　※老師代作答' : '');
  $('introTotal').textContent = TOTAL;
  $('introRows').textContent = rows.length === 9 ? '全部' : (rows.join('、') + ' 的乘法');

  var uploader = N.createUploader({
    url: window.TTD_GAS_URL,
    fetchFn: window.fetch.bind(window),
    storage: window.localStorage
  });

  var state = null;

  function uuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function newState() {
    return {
      sessionId: uuid(), classCode: classCode, seat: seat,
      cells: C.shuffle(C.cellsForRows(rows)), idx: 0, results: [], baselineMs: null,
      rows: rows,
      breakDone: false, startedAt: new Date().toISOString()
    };
  }

  function show(id) {
    ['introStage', 'baselineStage', 'quizStage', 'breakStage', 'doneStage']
      .forEach(function (s) { $(s).hidden = (s !== id); });
  }

  /* ---- 作答鍵盤 ---- */
  var current = null;
  var submitBtn = null;

  /**
   * 送出鍵的狀態。
   * 沒輸入 → 停用；輸入一位數 → 亮起（只有這時才需要按，兩位數會自動送出）。
   * 兩者手感不同是刻意的：九九乘法答案多半兩位數，自動送出可省下 81 次點擊；
   * 但一位數時一定要讓學生一眼看出該按哪裡，否則會卡住。
   */
  function updateSubmitBtn() {
    if (!submitBtn) return;
    var n = (current && !current.isDone()) ? current.value().length : 0;
    submitBtn.disabled = (n === 0);
    submitBtn.classList.toggle('go', n === 1);
  }

  function buildPad() {
    var pad = $('pad');
    pad.innerHTML = '';
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '清除', '0', '送出']
      .forEach(function (label) {
        var b = document.createElement('button');
        b.textContent = label;
        if (label === '清除' || label === '送出') b.className = 'wide';
        if (label === '送出') { submitBtn = b; b.disabled = true; }
        b.onclick = function () {
          if (!current || current.isDone()) return;
          if (label === '清除') {
            $('ans').textContent = current.clear() || ' ';
          } else if (label === '送出') {
            current.submit();
          } else {
            $('ans').textContent = current.pressDigit(label) || ' ';
          }
          updateSubmitBtn();
        };
        pad.appendChild(b);
      });
  }
  buildPad();

  function nextQuestion() {
    // 中場休息（8.1）
    if (BREAK_AT > 0 && state.idx === BREAK_AT && !state.breakDone) {
      state.breakDone = true;
      Q.saveProgress(state);
      show('breakStage');
      return;
    }
    if (state.idx >= state.cells.length) { finishSession('complete'); return; }

    var cell = state.cells[state.idx];
    $('prog').textContent = (state.idx + 1) + ' / ' + state.cells.length;
    $('q').textContent = cell.a + ' × ' + cell.b;
    $('ans').textContent = ' ';
    $('fb').textContent = '';
    $('fb').className = 'fb';

    current = Q.createQuestion({
      cell: cell,
      onFinish: function (r) {
        state.results.push(r);
        state.idx++;
        Q.saveProgress(state);

        // 只回饋對錯，不顯示正確答案（8.1）
        if (r.ok === 1) { $('fb').textContent = '✓'; $('fb').className = 'fb ok'; }
        else if (r.ok === 0) { $('fb').textContent = '✗'; $('fb').className = 'fb no'; }
        else { $('fb').textContent = '先跳過'; $('fb').className = 'fb'; }

        updateSubmitBtn();
        setTimeout(nextQuestion, 400);
      }
    });
    current.start();
    updateSubmitBtn();
  }

  $('resume').onclick = function () { show('quizStage'); nextQuestion(); };

  /* ---- 基準校準（4.5） ---- */
  $('toBaseline').onclick = function () {
    state = newState();
    show('baselineStage');
    var bl = Q.createBaseline({
      trials: 5,
      onWait: function () { $('dot').className = 'dot'; $('dot').textContent = '等一下…'; },
      onGo: function () { $('dot').className = 'dot go'; $('dot').textContent = '按我！'; },
      onTooEarly: function () { $('baseMsg').textContent = '太早了，等變綠色再按。'; },
      onHit: function (n, total) {
        // 按過就立刻不再是綠色，避免學生對同一次重複按
        $('dot').className = 'dot';
        $('dot').textContent = '好';
        $('baseMsg').textContent = n + ' / ' + total;
      },
      onFinish: function (med) {
        state.baselineMs = Math.round(med);
        show('quizStage');
        nextQuestion();
      }
    });
    $('dot').onclick = bl.press;
    bl.start();
  };

  /* ---- 結束與上傳 ---- */

  /** 由某份作答狀態組出 payload。st 可以是別場（沒做完）的狀態。 */
  function buildPayload(st, status) {
    return {
      sessionId: st.sessionId,
      classCode: st.classCode,
      seat: st.seat,
      name: name,
      mode: 'diagnostic',
      context: 'class',
      status: status,
      answeredAt: st.startedAt,
      config: { sv: 1, thresholdMs: C.DEFAULT_THRESHOLD_MS, limitSec: null,
                baselineMs: st.baselineMs, proxy: isProxy ? 1 : 0,
                rows: C.formatRows(st.rows || rows) },
      detail: C.encodeDetail(st.results)
    };
  }

  /** 送出。onMsg 省略代表背景補送，不顯示訊息。 */
  function upload(payload, onMsg) {
    setTimeout(function () {                    // 座號決定的錯開延遲（D16）
      uploader.flush().then(function () {       // 先補送別人的殘留（9.2）
        return uploader.send(payload);
      }).then(function (r) {
        if (!onMsg) return;
        if (r.status === 'sent') onMsg('成績已上傳。', false);
        else if (r.status === 'rejected') onMsg('上傳被拒（' + r.code + '），請告訴老師。', true);
        else onMsg('暫時連不上，資料已存在這台平板，下次開啟會自動補送。', false);
      });
    }, N.uploadDelayMs(payload.seat));
  }

  /**
   * 沒做完就離開的場次也要送出（設計文件 8.1 的 partial）。
   * 原本漏做這段，學生中途停下時作答會留在平板、永遠不會進資料庫。
   */
  function uploadAbandoned(st) {
    if (!st || !st.results || !st.results.length) return;
    upload(buildPayload(st, 'partial'), null);
  }

  function finishSession(status) {
    Q.clearProgress();
    var correct = state.results.filter(function (r) { return r.ok === 1; }).length;
    $('doneSummary').textContent = '答對 ' + correct + ' 題，共 ' + state.results.length + ' 題。';
    show('doneStage');

    if (!uploader.queue.available()) {
      $('upMsg').textContent = '這台平板無法暫存資料，請不要關閉頁面直到上傳完成。';
      $('upMsg').className = 'msg err';
    }

    upload(buildPayload(state, status), function (msg, isErr) {
      $('upMsg').textContent = msg;
      $('upMsg').className = isErr ? 'msg err' : 'msg';
    });
  }

  /** 學生主動提早結束：已作答的部分照樣送出。 */
  $('stopEarly').onclick = function () {
    if (!state || !state.results.length) { location.href = 'index.html'; return; }
    if (!confirm('要先做到這裡嗎？\n已經做的 ' + state.results.length +
                 ' 題會送出，下次可以再測其他範圍。')) return;
    finishSession('partial');
  };

  $('toMe').onclick = function () {
    location.href = 'me.html?cls=' + encodeURIComponent(classCode) + '&seat=' + seat;
  };

  /* ---- 續作（8.1） ---- */
  var saved = Q.loadProgress();
  if (saved && saved.cells && saved.results && saved.results.length &&
      saved.idx > 0 && saved.idx < saved.cells.length) {
    if (saved.classCode !== classCode || saved.seat !== seat) {
      uploadAbandoned(saved);   // 共用平板：上一位沒做完就走了，幫他送出
      Q.clearProgress();
    } else if (confirm('要繼續上次的診斷嗎？已經完成 ' + saved.idx +
                       ' 題。\n\n按「取消」會把已做的部分送出，然後重新開始。')) {
      state = saved;
      show('quizStage');
      nextQuestion();
    } else {
      uploadAbandoned(saved);   // 不可直接丟掉——那是真實作答紀錄
      Q.clearProgress();
    }
  }

  // 頁面載入時就先補送殘留（9.2）
  uploader.flush();
})();
</script>
</body>
</html>
