<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>九九乘法｜精熟練習</title>
<link rel="stylesheet" href="style.css?v=202608312108">
<style>
  .stage { text-align: center; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; }
  .timer { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--weak); }
  .score { font-size: 22px; font-weight: 700; color: var(--accent); }
  .q { font-size: 60px; font-weight: 700; letter-spacing: 4px; margin: 18px 0 8px; }
  .ansbox {
    font-size: 42px; height: 62px; letter-spacing: 6px;
    border-bottom: 3px solid var(--line); display: inline-block; min-width: 140px;
  }
  .fb { height: 32px; font-size: 24px; margin-top: 6px; }
  .fb.ok { color: var(--fluent); }
  .fb.no { color: var(--weak); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .pad button {
    font-size: 30px; padding: 16px 0; background: #fff; color: var(--ink);
    border: 1px solid var(--line);
  }
  .pad button.wide { font-size: 20px; }
  .pad button:disabled { background: #fbfaf8; color: #cdc8be; }
  .pad button.go {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-weight: 700; box-shadow: 0 0 0 3px rgba(63, 125, 140, .18);
  }
  .locked { opacity: .45; pointer-events: none; }
  .bigscore { font-size: 52px; font-weight: 700; color: var(--accent); }
  .stars { font-size: 40px; letter-spacing: 6px; margin: 10px 0; }
  .starline { font-size: 16px; line-height: 2; text-align: left; display: inline-block; }
  .starline .got { color: var(--ink); }
  .starline .miss { color: var(--muted); }
  .intro { text-align: left; line-height: 1.9; }
  .time-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
               gap: 8px; max-width: 400px; margin: 0 auto; }
  .time-btn { background: #fff; border: 1px solid var(--line); color: var(--muted);
              padding: 14px 4px; font-size: 17px; font-weight: 700; }
  .time-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pbbanner {
    background: var(--fluent); color: #fff; border-radius: 12px;
    padding: 12px; font-size: 18px; font-weight: 700; margin-bottom: 12px;
  }
  .goalbox {
    margin-top: 16px; padding: 14px; border: 1px solid var(--line);
    border-radius: 12px; background: #faf9f6; text-align: left; font-size: 16px;
    line-height: 1.9;
  }
  .goalbox .bar { height: 8px; background: var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .goalbox .bar > i { display: block; height: 100%; background: var(--fluent); }
</style>
</head>
<body>
<div class="wrap">

  <div class="card stage" id="introStage">
    <h1>精熟練習</h1>
    <p class="sub" id="who"></p>
    <p class="intro" id="introText">載入中…</p>
    <p class="intro sub" id="weakNote" style="margin-top:-8px"></p>
    <div id="timePick" hidden style="margin:16px 0">
      <div style="font-size:16px;font-weight:700;margin-bottom:8px">要練幾分鐘？</div>
      <div class="time-grid" id="timeBtns"></div>
    </div>
    <button id="go" disabled>開始</button>
    <div class="msg" id="introMsg"></div>
  </div>

  <div class="card stage" id="playStage" hidden>
    <div class="topbar">
      <span class="timer" id="timer">—</span>
      <span class="score" id="score">0 分</span>
    </div>
    <div class="q" id="q">7 × 8</div>
    <div class="ansbox" id="ans">&nbsp;</div>
    <div class="fb" id="fb"></div>
    <div class="pad" id="pad"></div>
  </div>

  <div class="card stage" id="doneStage" hidden>
    <h1>時間到</h1>
    <div id="pb" hidden class="pbbanner">🎉 破紀錄！比之前最好的還多 <span id="pbDiff"></span> 題</div>
    <div class="bigscore" id="finalScore">0 分</div>
    <div class="sub" id="finalDetail"></div>
    <div class="stars" id="stars"></div>
    <div class="starline" id="starDetail"></div>
    <div id="goalBox" class="goalbox" hidden></div>
    <div class="msg" id="upMsg">成績上傳中…</div>
    <div style="margin-top:16px">
      <button id="again">再來一次</button>
      <button id="toMe" class="ghost">看我的紀錄</button>
    </div>
  </div>

</div>

<script src="fact-core.js?v=202608312108"></script>
<script src="fact-net.js?v=202608312108"></script>
<script src="fact-quiz.js?v=202608312108"></script>
<script src="config.js?v=202608312108"></script>
<script>
(function () {
  'use strict';
  var C = window.FactCore, N = window.FactNet, Q = window.FactQuiz;
  var $ = function (id) { return document.getElementById(id); };

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  var classCode = qs('cls');
  var seat = Number(qs('seat'));
  var rows = C.parseRows(qs('r'));
  var name = sessionStorage.getItem('ttd_name') || '';
  if (!classCode || !seat) { location.href = 'index.html'; return; }
  $('who').textContent = name ? (name + '（' + seat + ' 號）') : (seat + ' 號');

  var LOCK_MS = 1500;      // 答錯的鎖定時間。限時模式裡不罰的話，狂點鍵盤就是最佳策略
  var POINT = 10;          // 答對得分。答錯不扣分，分數只會往上（DECISIONS P1）
  var QUEUE = 200;         // 先抽一批題目備用，限時模式不知道會做幾題

  var uploader = N.createUploader({
    url: window.TTD_GAS_URL,
    fetchFn: window.fetch.bind(window),
    storage: window.localStorage
  });

  var cfg = null, myCells = null, prevBest = null;
  var limitSec = 180;                       // 預設三分鐘，載入班級設定後覆蓋
  var TIME_CHOICES = [60, 120, 180, 300];   // 1／2／3／5 分鐘
  var state = null, current = null, submitBtn = null, timerId = null, locked = false;

  function uuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function show(id) {
    ['introStage', 'playStage', 'doneStage'].forEach(function (s) {
      $(s).hidden = (s !== id);
    });
  }

  /* ---- 載入個人資料：要靠快照決定抽哪些題 ---- */
  var url = window.TTD_GAS_URL + '?action=myrecord&cls=' + encodeURIComponent(classCode) +
            '&seat=' + seat;
  fetch(url, { redirect: 'follow' }).then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r.ok) { $('introText').textContent = '讀不到資料（' + r.code + '）'; return; }
      cfg = r;
      myCells = r.all;

      limitSec = Number(r.sprintSec) || 180;
      buildTimeButtons();

      var weak = C.weakList(r.all).filter(function (w) {
        return rows.indexOf(w.a) >= 0;
      }).length;
      $('weakNote').textContent = weak
        ? ('這個範圍裡有 ' + weak + ' 題還要加強，題目會多出這些。')
        : '題目會多出你比較不熟的。';

      refreshIntro();
      $('go').disabled = false;
    })
    .catch(function () { $('introText').textContent = '連不上伺服器。'; });


  /** 同一個範圍、同樣時間長度的最佳成績。長度不同不能比——3 分鐘當然比 1 分鐘答得多。 */
  function bestFor(sec) {
    var mine = C.formatRows(rows), best = null;
    ((cfg && cfg.sprints) || []).forEach(function (sp) {
      if (String(sp.rows) !== mine) return;
      if (Number(sp.limitSec) !== Number(sec)) return;
      if (best === null || sp.correct > best) best = sp.correct;
    });
    return best;
  }

  function minLabel(sec) {
    return (sec % 60 === 0) ? (sec / 60 + ' 分') : (sec + ' 秒');
  }

  function buildTimeButtons() {
    var box = $('timeBtns');
    box.innerHTML = '';
    var choices = TIME_CHOICES.slice();
    if (choices.indexOf(limitSec) < 0) choices.push(limitSec);   // 老師設了非標準秒數也要能選
    choices.sort(function (a, b) { return a - b; });
    choices.forEach(function (sec) {
      var b = document.createElement('button');
      b.className = 'time-btn' + (sec === limitSec ? ' on' : '');
      b.textContent = minLabel(sec);
      b.onclick = function () {
        limitSec = sec;
        Array.prototype.forEach.call(box.children, function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        refreshIntro();
      };
      box.appendChild(b);
    });
    $('timePick').hidden = false;
  }

  function refreshIntro() {
    prevBest = bestFor(limitSec);
    $('introText').innerHTML =
      '<strong>' + minLabel(limitSec) + '鐘</strong>內答對越多越好，答對一題 ' + POINT + ' 分。<br>' +
      '答錯不扣分，但會停 1.5 秒，所以<strong>不要亂按</strong>。<br>' +
      (prevBest === null
        ? ('這是你第一次練這個範圍的 ' + minLabel(limitSec) + '鐘。')
        : ('同樣 ' + minLabel(limitSec) + '鐘，上次最好答對 <strong>' + prevBest +
           '</strong> 題，這次超過就有星星。'));
  }

  /* ---- 鍵盤 ---- */
  function updateSubmitBtn() {
    if (!submitBtn) return;
    var n = (current && !current.isDone()) ? current.value().length : 0;
    submitBtn.disabled = (n === 0);
    submitBtn.classList.toggle('go', n === 1);
  }

  function buildPad() {
    var pad = $('pad');
    pad.innerHTML = '';
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '清除', '0', '送出']
      .forEach(function (label) {
        var b = document.createElement('button');
        b.textContent = label;
        if (label === '清除' || label === '送出') b.className = 'wide';
        if (label === '送出') { submitBtn = b; b.disabled = true; }
        b.onclick = function () {
          if (locked || !current || current.isDone()) return;
          if (label === '清除') $('ans').textContent = current.clear() || ' ';
          else if (label === '送出') current.submit();
          else $('ans').textContent = current.pressDigit(label) || ' ';
          updateSubmitBtn();
        };
        pad.appendChild(b);
      });
  }
  buildPad();

  /* ---- 開始 ---- */
  $('go').onclick = function () {
    state = {
      sessionId: uuid(),
      queue: C.pickSprint(myCells, rows, QUEUE, Math.random),
      idx: 0, results: [], correct: 0,
      startedAt: new Date().toISOString(),
      endAt: Date.now() + limitSec * 1000
    };
    show('playStage');
    tick();
    timerId = setInterval(tick, 200);
    nextQuestion();
  };

  function tick() {
    var left = Math.max(0, Math.ceil((state.endAt - Date.now()) / 1000));
    $('timer').textContent = left;
    $('timer').className = 'timer' + (left <= 10 ? ' low' : '');
    if (left <= 0) finish();
  }

  function nextQuestion() {
    if (!state || Date.now() >= state.endAt) return;
    if (state.idx >= state.queue.length) {
      state.queue = state.queue.concat(C.pickSprint(myCells, rows, QUEUE, Math.random));
    }
    var cell = state.queue[state.idx];
    $('q').textContent = cell.a + ' × ' + cell.b;
    $('ans').textContent = ' ';
    $('fb').textContent = '';
    $('fb').className = 'fb';

    current = Q.createQuestion({
      cell: cell,
      timeoutMs: 30000,      // 限時模式本來就有總時限，單題不再另外跳題
      onFinish: function (r) {
        state.results.push(r);
        state.idx++;
        if (r.ok === 1) {
          state.correct++;
          $('score').textContent = (state.correct * POINT) + ' 分';
          $('fb').textContent = '＋' + POINT;
          $('fb').className = 'fb ok';
          setTimeout(nextQuestion, 200);
        } else {
          // 答錯不扣分，改用時間懲罰——分數只往上，但亂按會很虧
          $('fb').textContent = '✗';
          $('fb').className = 'fb no';
          locked = true;
          $('pad').classList.add('locked');
          setTimeout(function () {
            locked = false;
            $('pad').classList.remove('locked');
            nextQuestion();
          }, LOCK_MS);
        }
        updateSubmitBtn();
      }
    });
    current.start();
    updateSubmitBtn();
  }

  /* ---- 結束 ---- */
  function finish() {
    if (!state || state.done) return;
    state.done = true;
    if (timerId) { clearInterval(timerId); timerId = null; }
    show('doneStage');

    var cpm = C.cpmOf(state.correct, limitSec);
    $('finalScore').textContent = (state.correct * POINT) + ' 分';
    $('finalDetail').textContent = '答對 ' + state.correct + ' 題，每分鐘 ' + cpm + ' 題';

    var st = C.starsFor({
      correct: state.correct, cpm: cpm, cells: myCells, rows: rows,
      prevBest: prevBest, cpmGoal: cfg.cpmGoal
    });
    $('stars').textContent = '★'.repeat(st.count) + '☆'.repeat(3 - st.count);

    // 破紀錄：跟自己比，人人都有機會
    if (prevBest !== null && state.correct > prevBest) {
      $('pbDiff').textContent = (state.correct - prevBest);
      $('pb').hidden = false;
    }

    renderGoal(myCells, true);
    $('starDetail').innerHTML =
      line(st.progress, prevBest === null ? '第一次挑戰' : ('比上次的 ' + prevBest + ' 題進步')) +
      line(st.goal, '每分鐘達到 ' + cfg.cpmGoal + ' 題（目前 ' + cpm + '）') +
      line(st.mastered, '這個範圍全部都很熟了');

    // 只送有作答的題目
    if (!state.results.length) {
      $('upMsg').textContent = '這次沒有作答，不用上傳。';
      return;
    }
    upload(cpm);
  }

  /**
   * 還差幾格——快完成的東西最有拉力。
   * pending=true 代表這場的成績還沒算進來（伺服器要重算快照），先標明；
   * 上傳成功後會重抓一次，換成真正的最新進度。
   */
  function renderGoal(cells, pending) {
    var pr = C.progressOf(cells, rows);
    if (!pr.total) return;
    var label = rows.length === 9 ? '全部九九乘法'
              : rows.length === 1 ? (rows[0] + ' 的乘法')
              : (rows.join('、') + ' 的乘法');
    var badgeWord = rows.length === 1 ? '點亮徽章' : ('點亮這 ' + rows.length + ' 枚徽章');

    if (pr.remain === 0) {
      $('goalBox').innerHTML = '<strong>' + label + '已經全部練熟了。</strong><br>' +
                               '可以挑戰別的數字了。';
    } else {
      var pct = Math.round(pr.green / pr.total * 100);
      $('goalBox').innerHTML =
        '<strong>' + label + '</strong>　還差 <strong>' + pr.remain + '</strong> 格就能' +
        badgeWord + '<br>' +
        '<span class="sub">目前 ' + pr.green + ' / ' + pr.total + ' 題已經很熟</span>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        (pending ? '<span class="sub">（這次的成績還在計算，稍後會更新）</span>' : '');
    }
    $('goalBox').hidden = false;
  }

  /** 上傳成功後重抓一次，讓進度立刻反映這場的成績。 */
  function refreshGoal() {
    var u = window.TTD_GAS_URL + '?action=myrecord&cls=' + encodeURIComponent(classCode) +
            '&seat=' + seat;
    fetch(u, { redirect: 'follow' }).then(function (r) { return r.json(); })
      .then(function (r) { if (r.ok) renderGoal(r.all, false); })
      .catch(function () { /* 抓不到就維持原本的顯示 */ });
  }

  function line(got, text) {
    return '<div class="' + (got ? 'got' : 'miss') + '">' +
           (got ? '★ ' : '☆ ') + text + '</div>';
  }

  function upload(cpm) {
    var payload = {
      sessionId: state.sessionId,
      classCode: classCode,
      seat: seat,
      name: name,
      mode: 'sprint',
      context: 'class',
      status: 'complete',
      answeredAt: state.startedAt,
      config: { sv: 1, thresholdMs: C.DEFAULT_THRESHOLD_MS,
                limitSec: limitSec, baselineMs: null,
                rows: C.formatRows(rows) },
      detail: C.encodeDetail(state.results)
    };
    setTimeout(function () {
      uploader.flush().then(function () {
        return uploader.send(payload);
      }).then(function (r) {
        if (r.status === 'sent') {
          $('upMsg').textContent = '成績已上傳。';
          refreshGoal();
        }
        else if (r.status === 'rejected') {
          $('upMsg').textContent = '上傳被拒（' + r.code + '），請告訴老師。';
          $('upMsg').className = 'msg err';
        } else {
          $('upMsg').textContent = '暫時連不上，資料已存在這台平板，下次開啟會自動補送。';
        }
      });
    }, N.uploadDelayMs(seat));
  }

  $('again').onclick = function () { location.reload(); };
  $('toMe').onclick = function () {
    location.href = 'me.html?cls=' + encodeURIComponent(classCode) + '&seat=' + seat;
  };

  uploader.flush();
})();
</script>
</body>
</html>
