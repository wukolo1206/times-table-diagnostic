<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的九九乘法</title>
<link rel="stylesheet" href="style.css?v=202608291959">
<style>
  table.heat { margin: 8px auto; }
  table.heat th, table.heat td { width: 40px; height: 40px; font-size: 13px; }
  ul.weaklist { padding-left: 20px; line-height: 2; font-size: 18px; }
  .cmp { display: flex; gap: 20px; flex-wrap: wrap; }
  .cmp > div { flex: 1 1 130px; }
  .big { font-size: 30px; font-weight: 700; }
  .badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
  .badge {
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px;
    text-align: center; background: #fff;
  }
  .badge .n { font-size: 26px; font-weight: 700; color: var(--unknown); }
  .badge .p { font-size: 12px; color: var(--muted); }
  .badge.done { background: var(--fluent); border-color: var(--fluent); }
  .badge.done .n { color: #fff; }
  .badge.done .p { color: rgba(255,255,255,.9); }
  .bar { height: 5px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--fluent); }
  .best-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .best-row > div { flex: 1 1 110px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">我的九九乘法</h1>
  <p class="sub" id="sub">載入中…</p>

  <div class="card">
    <div class="gridwrap"><table class="heat" id="heat"></table></div>
    <div class="legend">
      <span><i style="background:var(--fluent)"></i>很熟</span>
      <span><i style="background:var(--shaky)"></i>還要再快一點</span>
      <span><i style="background:var(--weak)"></i>還要多練</span>
      <span><i style="background:var(--unknown)"></i>還沒測過</span>
      <span>斜紋＝只測過一兩次，還不準</span>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 4px">我的徽章</h2>
    <p class="sub" style="margin:0 0 12px">一個數字的九題全部變綠，就能點亮那一枚。</p>
    <div class="badge-grid" id="badges"></div>
    <div style="margin-top:12px;font-size:17px" id="badgeCount"></div>
  </div>

  <div class="card" id="bestCard" hidden>
    <h2 style="margin:0 0 10px">我的最佳紀錄</h2>
    <div class="best-row" id="best"></div>
  </div>

  <div class="card" id="weakCard" hidden>
    <h2 style="margin:0 0 8px">我還要多練的</h2>
    <ul class="weaklist" id="weakList"></ul>
  </div>

  <div class="card" id="cmpCard" hidden>
    <h2 style="margin:0 0 12px">我的進步</h2>
    <div class="cmp" id="cmp"></div>
  </div>

  <div class="card" id="actionCard">
    <div id="actionHint" class="sub" style="margin:0 0 10px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="practice">練我的弱項</button>
      <button id="home" class="ghost">回首頁選別的</button>
    </div>
  </div>

  <div class="card">
    <button id="dl" class="ghost">下載我的紀錄</button>
  </div>
</div>

<script src="fact-core.js?v=202608291959"></script>
<script src="config.js?v=202608291959"></script>
<script>
(function () {
  'use strict';
  var C = window.FactCore;
  var $ = function (id) { return document.getElementById(id); };

  function qs(n) {
    var m = new RegExp('[?&]' + n + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  var classCode = qs('cls'), seat = Number(qs('seat'));
  if (!classCode || !seat) { location.href = 'index.html'; return; }

  // 學生端用語：紅格說「還要多練」，不說「不會」（Q5 定案）
  var LABEL = {};
  LABEL[C.LEVEL.FLUENT] = '很熟';
  LABEL[C.LEVEL.SHAKY] = '還要再快一點';
  LABEL[C.LEVEL.WEAK] = '還要多練';
  LABEL[C.LEVEL.UNKNOWN] = '還沒測過';

  function renderHeat(cells) {
    var t = $('heat');
    t.innerHTML = '';
    var head = t.insertRow();
    head.insertCell().outerHTML = '<th>×</th>';
    for (var b = 1; b <= 9; b++) head.insertCell().outerHTML = '<th>' + b + '</th>';

    for (var a = 1; a <= 9; a++) {
      var tr = t.insertRow();
      tr.insertCell().outerHTML = '<th>' + a + '</th>';
      for (var bb = 1; bb <= 9; bb++) {
        var c = cells[C.cellIndex(a, bb)];
        var td = tr.insertCell();
        td.className = c.lv + (c.tent ? ' tent' : '');
        td.textContent = a * bb;
        td.title = a + ' × ' + bb + '＝' + (a * bb) + '　' + LABEL[c.lv] +
                   (c.n ? ('（測過 ' + c.n + ' 次）') : '');
      }
    }
  }

  function renderWeak(cells) {
    var items = [];
    for (var i = 0; i < 81; i++) {
      if (cells[i].lv === C.LEVEL.WEAK || cells[i].lv === C.LEVEL.SHAKY) {
        var cc = C.cellOf(i);
        items.push({ a: cc.a, b: cc.b, lv: cells[i].lv, med: cells[i].med || 0 });
      }
    }
    if (!items.length) return;
    items.sort(function (x, y) {
      if (x.lv !== y.lv) return x.lv === C.LEVEL.WEAK ? -1 : 1;
      return y.med - x.med;
    });
    var ul = $('weakList');
    ul.innerHTML = '';
    items.slice(0, 12).forEach(function (it) {
      var li = document.createElement('li');
      li.textContent = it.a + ' × ' + it.b + ' ＝ ' + (it.a * it.b);
      ul.appendChild(li);
    });
    $('weakCard').hidden = false;
  }

  function renderCompare(list) {
    if (list.length < 2) return;
    var first = list[0], last = list[list.length - 1];
    var diff = last.correct - first.correct;
    var box = $('cmp');
    box.innerHTML = '';
    [['第一次答對', first.correct + ' 題'],
     ['最近一次答對', last.correct + ' 題'],
     ['進步', (diff >= 0 ? '+' : '') + diff + ' 題']].forEach(function (p) {
      var d = document.createElement('div');
      var t = document.createElement('div');
      t.className = 'sub'; t.style.margin = '0'; t.textContent = p[0];
      var v = document.createElement('div');
      v.className = 'big'; v.textContent = p[1];
      d.appendChild(t); d.appendChild(v);
      box.appendChild(d);
    });
    $('cmpCard').hidden = false;
  }

  function renderBadges(cells) {
    var bs = C.badgesOf(cells);
    var box = $('badges');
    box.innerHTML = '';
    bs.forEach(function (b) {
      var d = document.createElement('div');
      d.className = 'badge' + (b.done ? ' done' : '');
      d.innerHTML = '<div class="n">' + b.a + '</div>' +
                    '<div class="p">' + (b.done ? '完成' : b.green + ' / 9') + '</div>' +
                    (b.done ? '' : '<div class="bar"><i style="width:' +
                     Math.round(b.green / 9 * 100) + '%"></i></div>');
      d.title = b.a + ' 的乘法：' + b.green + ' / 9 題已經很熟';
      box.appendChild(d);
    });
    var done = bs.filter(function (b) { return b.done; }).length;
    $('badgeCount').textContent = done === 9
      ? '九枚全部收集完成，九九乘法全部練熟了。'
      : ('已收集 ' + done + ' / 9 枚');
  }

  function renderBest(sprints) {
    if (!sprints || !sprints.length) return;
    var bestCorrect = 0, bestCpm = 0;
    sprints.forEach(function (sp) {
      if (sp.correct > bestCorrect) bestCorrect = sp.correct;
      if (sp.cpm && sp.cpm > bestCpm) bestCpm = sp.cpm;
    });
    var box = $('best');
    box.innerHTML = '';
    [['最高分', (bestCorrect * 10) + ' 分'],
     ['最快速度', bestCpm + ' 題／分'],
     ['練習次數', sprints.length + ' 次']].forEach(function (p) {
      var d = document.createElement('div');
      d.innerHTML = '<div class="sub" style="margin:0">' + p[0] +
                    '</div><div class="big">' + p[1] + '</div>';
      box.appendChild(d);
    });
    $('bestCard').hidden = false;
  }

  var url = window.TTD_GAS_URL + '?action=myrecord&cls=' + encodeURIComponent(classCode) +
            '&seat=' + seat;
  fetch(url, { redirect: 'follow' }).then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r.ok) { $('sub').textContent = '讀不到資料（' + r.code + '）'; return; }
      $('title').textContent = r.name ? (r.name + ' 的九九乘法') : (seat + ' 號的九九乘法');
      $('sub').textContent = '做過 ' + r.diagnostics.length + ' 次診斷。綠色是已經很熟的。';
      renderHeat(r.all);
      renderBadges(r.all);
      renderBest(r.sprints);
      renderWeak(r.all);
      renderCompare(r.diagnostics);

      // 看完弱項清單就該能直接開練，不然這一頁是死路
      var pr = C.rowsToPractice(r.all);
      var target = pr.slice(0, 3).map(function (x) { return x.a; });
      if (target.length) {
        $('actionHint').textContent =
          '直接練 ' + target.join('、') + ' 的乘法（' +
          target.length * 9 + ' 題裡會多出你不熟的）。';
      } else {
        $('actionHint').textContent = '測過的都很熟了，可以挑別的數字來練。';
        $('practice').textContent = '開始練習';
        target = [];
      }
      $('practice').onclick = function () {
        var u = 'sprint.html?cls=' + encodeURIComponent(classCode) + '&seat=' + seat;
        if (target.length) u += '&r=' + C.formatRows(target);
        location.href = u;
      };
      $('home').onclick = function () {
        location.href = 'index.html?cls=' + encodeURIComponent(classCode);
      };

      $('dl').onclick = function () {
        var blob = new Blob([JSON.stringify(r, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '我的九九乘法紀錄.json';
        a.click();
      };
    })
    .catch(function () { $('sub').textContent = '連不上伺服器。'; });
})();
</script>
</body>
</html>
